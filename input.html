<!DOCTYPE html>
<html lang="ko">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정보 방탈출</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-color: #e9e7df;
      background-image:
        linear-gradient(#d7d4ca 1px, transparent 1px),
        linear-gradient(90deg, #d7d4ca 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: "Do Hyeon", sans-serif;
      font-weight: 400;
      font-style: normal;
      color: #252822;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 34px 30px 30px;
      background: #faf9f4;
      border: 1px solid #b9b7ad;
      box-shadow: 5px 5px 0 #cecbc0;
    }

    .top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 28px;
      border-bottom: 1px solid #d5d2c8;
    }

    .category {
      color: #66695e;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .status {
      color: #a94f3d;
      font: 11px monospace;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 27px;
      letter-spacing: 0px;
    }

    .description {
      margin: 0 0 24px;
      color: #77776e;
      font-size: 13px;
      line-height: 1.8;
    }

    .timer-box {
      padding: 16px;
      margin-bottom: 28px;
      background: #efeee6;
      border: 1px solid #dedbd0;
    }

    .timer-label {
      margin-bottom: 8px;
      color: #77776e;
      font-size: 11px;
      letter-spacing: 1px;
    }

    #timer {
      color: #373d32;
      font: 32px monospace;
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      display: block;
      margin-bottom: 9px;
      color: #46493f;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #c8c6ba;
      border-radius: 0;
      background: #fffefa;
      color: #252822;
      font: 15px monospace;
      outline: none;
    }

    textarea:focus {
      border-color: #646d4a;
      box-shadow: inset 3px 0 #646d4a;
    }

    textarea::placeholder {
      color: #aaa99f;
      font-family: "Malgun Gothic", sans-serif;
      font-size: 13px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #30352b;
      border-radius: 0;
      background: #373d32;
      color: #faf9f4;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:hover {
      background: #505844;
    }

    #result {
      margin-top: 15px;
      color: #a94f3d;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bottom-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 30px;
      padding-top: 13px;
      border-top: 1px solid #d5d2c8;
      color: #96958b;
      font: 10px monospace;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="top-line">
      <span class="category">정보 방탈출 / ENTRY 01</span>
      <span class="status">LOCKED</span>
    </div>

    <h2>암호 입력창</h2>

    <p class="description">
      잠금 장치가 작동 중입니다.<br>
      단서를 확인하고 암호를 입력하세요.
    </p>

    <div class="timer-box">
      <div class="timer-label">ELAPSED TIME</div>
      <div id="timer">00:00.00</div>
    </div>

    <form id="inputForm">
      <label class="section-title" for="userInput">ACCESS CODE</label>

      <textarea
        id="userInput"
        placeholder="암호 입력..."
        rows="1"
        required
      ></textarea>

      <button type="submit">잠금 해제　→</button>
    </form>

    <div id="result" aria-live="polite"></div>

    <div class="bottom-line">
      <span>SECURITY SYSTEM</span>
      <span>ENTRY 01</span>
    </div>
  </main>
<script type="module">
  // 1. Firebase 라이브러리 불러오기
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";


  // 2. Firebase 설정
  const firebaseConfig = {
    apiKey: "AIzaSyDnGoHTQuK8HkJ6KkoxYovAAaIk9yI7yi0",
    authDomain: "thinkful-edu-party.firebaseapp.com",

    // Firebase Realtime Database 화면의 실제 URL을 넣어!
    databaseURL: "https://thinkful-edu-party-default-rtdb.firebaseio.com/",

    projectId: "thinkful-edu-party",
    storageBucket: "thinkful-edu-party.firebasestorage.app",
    messagingSenderId: "903216777527",
    appId: "1:903216777:web:81cb519bca7d7f1c5ff2b2",
    measurementId: "G-V9FJY91PZ3"
  };


  // 3. Firebase 연결
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);


  // 4. HTML 요소 연결
  const form = document.getElementById("inputForm");
  const input = document.getElementById("userInput");
  const result = document.getElementById("result");
  const timer = document.getElementById("timer");

  const startTime = Number(
    localStorage.getItem("escapeStartTime")
  );

  let timerInterval = null;


  // 5. 시간 표시 함수
  function formatTime(milliseconds) {
    const totalCentiseconds = Math.floor(milliseconds / 10);
    const minutes = Math.floor(totalCentiseconds / 6000);
    const seconds = Math.floor(totalCentiseconds / 100) % 60;
    const centiseconds = totalCentiseconds % 100;

    return (
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0") + "." +
      String(centiseconds).padStart(2, "0")
    );
  }


  // 6. 타이머
  function updateTimer() {
    if (startTime > 0) {
      timer.textContent = formatTime(Date.now() - startTime);
    }
  }

  if (startTime > 0) {
    updateTimer();
    timerInterval = setInterval(updateTimer, 30);
  } else {
    timer.textContent = "--:--.--";
    result.textContent = "시작 화면에서 게임을 시작해 주세요.";

    input.disabled = true;
    form.querySelector("button").disabled = true;
  }


  // 7. 암호 확인
  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const value = input.value.trim();

    if (!value) {
      result.textContent = "암호를 입력해 주세요.";
      return;
    }

    try {
      // Firebase 데이터베이스에서 현재 암호 가져오기
      const snapshot = await get(
        ref(db, "escapePassword")
      );

      // 관리자가 암호를 설정하지 않았다면 기본 암호는 ??
      const correctPassword = snapshot.exists()
        ? snapshot.val()
        : "??";

      if (value === correctPassword) {
        // 탈출 시간 계산 및 저장
        const elapsedTime = Date.now() - startTime;

        clearInterval(timerInterval);

        localStorage.setItem(
          "escapeElapsedTime",
          elapsedTime.toString()
        );

        // 탈출 기록 화면으로 이동
        window.location.href = "result.html";

      } else {
        result.textContent = "암호가 올바르지 않습니다.";
        input.value = "";
        input.focus();
      }

    } catch (error) {
      console.error("Firebase 오류:", error);

      result.textContent =
        "암호를 확인할 수 없습니다. 인터넷 연결이나 데이터베이스 설정을 확인해 주세요.";
    }
  });
</script>
</body>
</html>
