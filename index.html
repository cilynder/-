
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정보 방탈출</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000012;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #222;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: #4f46e5;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    #result {
      margin-top: 16px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      color: #333;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>암호 입력창</h2>

    <form id="inputForm">
      <label for="userInput">입력</label>
      <textarea
        id="userInput"
        placeholder="암호 입력..."
        required
      ></textarea>

      <button type="submit">확인</button>
    </form>

    <div id="result" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById("inputForm");
    const input = document.getElementById("userInput");
    const result = document.getElementById("result");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const value = input.value.trim();

      if (!value) {
        result.textContent = "암호를 입력해 주세요.";
        return;
      }

      result.textContent = "입력한 내용: " + value;
    });
  </script>
</body>
</html>
